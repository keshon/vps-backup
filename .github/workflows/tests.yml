name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install rclone for disposable local integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rclone
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o dist/ ./cmd/vps-backup
      - uses: actions/upload-artifact@v4
        with:
          name: vps-backup-${{ runner.os }}
          path: dist/*
